
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
  namespace: linkding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      securityContext:
        fsGroup: 33
        runAsUser: 33
        runAsGroup: 33

      containers:
        - name: linkding
          image: sissbruecker/linkding:1.31.0
          envFrom:
             - secretRef:
                     name: linkding-container-env
          lifecycle:
            postStart:
              exec:
                command:
                    - /bin/sh
                    - -c
                    - |
                        echo "Running additional command..."
                        cat /etc/linkding/creds/creds.json
                        echo "Exit code: $?" >> /tmp/poststart.log
          ports:
            - containerPort: 9090

          securityContext:
            allowPrivilegeEscalation: false

          volumeMounts:
            - name: linkding-data
              mountPath: /etc/linkding/data

            - name: creds
              mountPath: /etc/linkding/creds
              readOnly: true

      volumes:
        - name: linkding-data
          persistentVolumeClaim:
            claimName: linkding-data-pvc

        - name: creds
          secret:
            secretName: linkding-credentials-secret

